<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="images/brand/smart-placement-icon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Placement System - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-box">
        <img
            class="login-logo"
            src="images/brand/smart-placement-logo.svg"
            alt="Smart Placement"
        >

        <h1>Welcome back</h1>
        <p class="login-subtitle">
            Sign in to manage your placement journey.
        </p>

        <p id="auth-message" class="auth-alert" role="alert" hidden></p>

        <form action="login" method="post">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In</button>

        </form>

        <p class="auth-switch">
            New to Smart Placement?
            <a href="signup">Create an account</a>
        </p>
    </main>

    <script>
        (function () {
            const messages = {
                error: ["error", "Invalid email or password."],
                registered: ["success", "Account created successfully. Please sign in."]
            };

            const params = new URLSearchParams(window.location.search);
            const key = Object.keys(messages).find(name => params.has(name));

            if (!key) {
                return;
            }

            const box = document.getElementById("auth-message");
            box.classList.add(messages[key][0]);
            box.textContent = messages[key][1];
            box.hidden = false;
        })();
    </script>

</body>
</html>
